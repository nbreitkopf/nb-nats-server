server_name: nb-nats-server

port: 4222
http_port: 8222    # monitoring – internal only, never publish

max_payload: 1MB
max_connections: 64K


# Option A: WebSocket, TLS terminated by Traefik
websocket {
  port: 8080
  no_tls: true
}

# authorization {
#   token: $NATS_AUTH_TOKEN
# }

authorization {
  users = [
    { user: main, password: $NATS_MAIN_TOKEN }
  ]
}


# Option B: native TLS on 4222 (uncomment, mount certs)
# tls {
#   cert_file: /certs/live/nats.example.com/fullchain.pem
#   key_file:  /certs/live/nats.example.com/privkey.pem
# }


jetstream {
  store_dir: /data     # Creates /data/jetstream
  # max_memory_store: 1G
  # max_file_store: 10G
}   
