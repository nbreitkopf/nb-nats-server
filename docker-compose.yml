services:
  nats:
    image: nats:2.15.3-alpine
    restart: unless-stopped 
    command: ["-c", "/etc/nats/nats.conf"]
    expose:
      - "4222"
      - "8222"
      - "8080"
    environment:
      NATS_MAIN_TOKEN: ${NATS_MAIN_TOKEN}
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nats-data: