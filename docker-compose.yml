services:
  nats:
    build: .
    restart: unless-stopped
    expose:
      - "4222"
      - "8222"
      - "8080"
    environment:
      NATS_MAIN_TOKEN: ${NATS_MAIN_TOKEN}
    volumes:
      - nats-data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nats-data:

networks:
  dokploy-network:
    external: true